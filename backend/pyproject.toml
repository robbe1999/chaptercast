[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptercast"
version = "0.1.0"
description = "Turn a chapter of text into a narrated audiobook with the ElevenLabs API."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["chaptercast*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chaptercast --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:chaptercast.*"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "RUF001", "RUF012"]
# Typographic quotes/dashes are deliberate: the chunker must recognise them.
"chaptercast/chunking.py" = ["RUF001"]
# `timeout` is forwarded to asyncio.wait_for, not a cancellation scope we own.
"chaptercast/audio.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["chaptercast", "tests"]
