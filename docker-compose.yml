# Local / single-host deployment.
#
#   cp .env.example .env      # optional: add ELEVENLABS_API_KEY and an access token
#   docker compose up --build
#
# With no .env the app starts in demo mode (no API key, no cost).
services:
  chaptercast:
    build: .
    image: chaptercast:local
    # Bound to localhost only. Put a TLS-terminating reverse proxy in front to expose it.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    # Defence in depth: the container cannot write to its own filesystem, has no
    # Linux capabilities, cannot gain privileges and is resource-limited.
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700,size=256m
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
