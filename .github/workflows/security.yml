name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, so new advisories surface even without commits

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks + local scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # The gitleaks binary, pinned and checksum-verified, over the *whole* history.
      # (gitleaks-action only scans the pushed range, and fails on a repository's
      # first push because the root commit has no parent to diff against.)
      - name: Install gitleaks
        env:
          VERSION: "8.24.3"
          SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      - name: gitleaks (full history)
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - run: python3 scripts/scan_secrets.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
