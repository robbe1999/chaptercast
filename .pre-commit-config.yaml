repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        exclude: ^docs/media/ # the README demo GIF is deliberately a few MB
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3 # keep in step with the CI version in security.yml
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scan-secrets
        name: local secret scan
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: false
